usage:
   |
    Dockerized n8n. You can find documentation here
    https://docs.n8n.io/hosting/installation/docker/ on available settings.
    Once n8n starts, open the web UI and start creating workflows. Data is
    persisted in the mounted volume.

---  
name: {{ .SynpseTemplateID }}
scheduling:
  type: Conditional  
spec:
  containers:
    - name: n8n
      image: docker.n8n.io/n8nio/n8n
      user: root
      ports:
        - {{ .Port | default "5678" }}:5678
      volumes:
        - {{ .ModelDirectory | default "/data/n8n" }}:/home/node/
      env:
        - name: TZ
          value: {{ .Tz | default "Europe/London" }}
      restartPolicy: {}
proxy:
  tunnels:
    - localPort: {{ .Port | default "5678" }}