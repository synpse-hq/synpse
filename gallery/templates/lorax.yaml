usage: |
  LoRAX supports multi-turn chat conversations combined with dynamic adapter loading through an OpenAI compatible API. Just specify any adapter as the model parameter.  
examples:
  - title: Generate a chat completion
    description: "LoRAX supports multi-turn chat conversations combined with dynamic adapter loading through an OpenAI compatible API. Just specify any adapter as the model parameter:"
    code: |
      curl -H 'Content-Type: application/json' http://{{ .SynpseDeviceIP | default "localhost" }}:{{ .Port | default "8080" }}/v1/chat/completions -d '{
        "model": "vineetsharma/qlora-adapter-Mistral-7B-Instruct-v0.1-gsm8k",
        "messages": [{"role": "user", "content": "Say this is a test!"}]
      }'
  - title: Quantization
    description: |
      LoRAX supports loading the base model with quantization to reduce memory overhead, 
      while loading adapters in full (fp32) or half precision (fp16, bf16), similar to the approach described in QLoRA.

      See https://loraexchange.ai/guides/quantization/ for more info.
---
name: {{ .SynpseTemplateID }}
scheduling:
  type: Conditional
  selectors: {}  
spec:
  containers:
    - name: lorax
      image: ghcr.io/predibase/lorax:main
      args:
        - --model-id
        - {{ .Model }}
      gpus: all
      ipcMode: host
      ports:
        - {{ .Port | default "8080" }}:80
      volumes:
        - {{ .ModelDirectory | default "/data/lorax" }}:/data
      env:
        - name: HUGGING_FACE_HUB_TOKEN
          value: "{{ .HuggingFaceToken | default "" }}"
      restartPolicy: {}

  