usage: |
  OpenDevin is a platform for autonomous software engineers, powered by AI and LLMs.
  
examples:
  - title: Accessing OpenDevin
    description: |
      Once running, you will be able to access the web UI through either public Synpse URL or localhost if proxy
      is disabled ({{ .AppURL | default "http://localhost:3000" }}). First thing to do will be setting up
      your LLM backend.

---

name: {{ .SynpseTemplateID }}
scheduling:
  type: Conditional
  selectors: {}  
spec:
  containers:
    - name: opendevin
      image: ghcr.io/opendevin/opendevin:{{ .Tag | default "0.6.2" }}
      volumes:
        - {{ .WorkspaceBase | default "/data/opendevin-workspace" }}:/opt/workspace_base
        - /var/run/docker.sock:/var/run/docker.sock
      ports:
        - {{ .Port | default "3000" }}:3000
      env:
        - name: WORKSPACE_MOUNT_PATH
          value: {{ .WorkspaceBase | default "/data/opendevin-workspace" }}
        - name: PERSIST_SANDBOX
          value: "true"
        - name: SANDBOX_USER_ID
          value: "1000"
        - name: SSH_PASSWORD
          value: {{ .SshPassword | default "very-secret" }}
proxy:
  tunnels:
    - localPort: {{ .Port | default "3000" }}