name: llocal-search
scheduling:
  type: Conditional
  selectors: {}  
spec:
  containers:
    - name: backend
      image: nilsherzig/llocalsearch-backend:latest
      env:
        - name: OLLAMA_HOST
          value: http://ollama:11434
        - name: CHROMA_DB_URL
          value: http://chromadb:8000
        - name: SEARXNG_DOMAIN
          value: http://searxng:8080
        - name: MAX_ITERATIONS
          value: "30"
        - name: EMBEDDINGS_MODEL_NAME
          value: "nomic-embed-text:v1.5"
    # Frontend
    - name: frontend
      image: nilsherzig/llocalsearch-frontend:latest
      ports:
        - {{ .Port | default "3000" }}:4173
    # Ollama, running your models
    - name: ollama
      image: ollama/ollama:latest
      gpus: all
      # ports:
      #   - {{ .Port | default "11434" }}:11434
      volumes:
        - {{ .OllamaDataDir | default "/data/ollama" }}:/root/.ollama
    # Chroma for embeddings
    - name: chromadb
      image: chromadb/chroma:latest
      env:
        - name: IS_PERSISTENT
          value: "TRUE"
      volumes:
        - {{ .ChromaDataDir | default "/data/chroma" }}:/chroma/chroma/
    # Redis - cache KV store
    - name: redis
      image: redis:latest
      args:
        - redis-server
        - --save
        - '30'
        - '1'
        - --loglevel
        - warning
      volumes:
        - {{ .RedisDataDir | default "/data/redis" }}:/data
    # Search engine
    - name: searxng
      image: docker.io/searxng/searxng:latest
      env:
        - name: SEARXNG_BASE_URL
          value: https://localhost}/
      files:
        - filepath: /etc/searxng/limiter.toml
          contents: |
            [botdetection.ip_limit]
            # activate link_token method in the ip_limit method
            link_token = true
        - filepath: /etc/searxng/settings.yml
          contents: |
            # see https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
            use_default_settings: true
            server:
              # base_url is defined in the SEARXNG_BASE_URL environment variable, see .env and docker-compose.yml
              secret_key: "51b30631d62b441ec1715009d96cf324f89993401cb2ce8301c4170d2fe6ed13" # change this!
              limiter: false # can be disabled for a private instance
              image_proxy: true
            ui:
              static_use_hash: true
            redis:
              url: redis://redis:6379/0
            search:
              safe_search: 0
              autocomplete: ""
              default_lang: ""
              ban_time_on_fail: 5
              max_ban_time_on_fail: 120
              suspended_times:
                SearxEngineAccessDenied: 86400
                SearxEngineCaptcha: 86400
                SearxEngineTooManyRequests: 3600
                cf_SearxEngineCaptcha: 1296000
                cf_SearxEngineAccessDenied: 86400
                recaptcha_SearxEngineCaptcha: 604800
              formats:
                - html
                - json
        - filepath: /etc/searxng/uwsgi.ini
          contents: |
            [uwsgi]
            # Who will run the code
            uid = searxng
            gid = searxng

            # Number of workers (usually CPU count)
            # default value: %k (= number of CPU core, see Dockerfile)
            workers = %k

            # Number of threads per worker
            # default value: 4 (see Dockerfile)
            threads = 4

            # The right granted on the created socket
            chmod-socket = 666

            # Plugin to use and interpreter config
            single-interpreter = true
            master = true
            plugin = python3
            lazy-apps = true
            enable-threads = 4

            # Module to import
            module = searx.webapp

            # Virtualenv and python path
            pythonpath = /usr/local/searxng/
            chdir = /usr/local/searxng/searx/

            # automatically set processes name to something meaningful
            auto-procname = true

            # Disable request logging for privacy
            disable-logging = true
            log-5xx = true

            # Set the max size of a request (request-body excluded)
            buffer-size = 8192

            # No keep alive
            # See https://github.com/searx/searx-docker/issues/24
            add-header = Connection: close

            # uwsgi serves the static files
            static-map = /static=/usr/local/searxng/searx/static
            # expires set to one day
            static-expires = /* 86400
            static-gzip-all = True
            offload-threads = 4
      capDrop:
        - ALL
      capAdd:
        - CHOWN
        - SETGID
        - SETUID
      volumes:
        - {{ .SearxngDataDir | default "/data/searxng" }}:/data

