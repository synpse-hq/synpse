usage: |
  TODO

  Get your NGC API key from https://ngc.nvidia.com/setup/api-key and set it as the value for the NGC API key parameter

examples:
- title: 'Make an API call to the server'
  description: First, SSH into the machine where you want to deploy this template and fetch the models
  code: |
    curl -X 'POST' \
    '{{ .AppURL | default "http://localhost:8080" }}/v1/chat/completions' \
    -H 'accept: application/json' \
    -H 'Content-Type: application/json' \
    -d '{
        "model": "{{ .ModelName | default "meta/llama3-8b-instruct" }}",
        "messages": [{"role":"user", "content":"Write a limerick about the wonders of GPU computing."}],
        "max_tokens": 64
    }'

  
---
name: {{ .SynpseTemplateID }}
scheduling:
  type: Conditional
spec:
  containers:
    - name: nvidia-nim
      image: nvcr.io/nim/meta/{{ .ModelImage | default "llama3-8b-instruct:1.0.0" }}
      auth:
        username: $oauthtoken
        password: {{ .NgcApiKey}}
      gpus: all
      user: root
      ports:
        - {{ .Port | default "8080" }}:8000
      volumes:
        - {{ .ModelDirectory | default "/data/nvidia" }}:/opt/nim/.cache
      env:
        - name: NGC_API_KEY
          value: {{ .NgcApiKey}}
        - name: LOCAL_NIM_CACHE
          value: /opt/nim/
      restartPolicy: {}
proxy:
  tunnels:
    - localPort: {{ .Port | default "8000" }}
