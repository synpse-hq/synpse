usage: |
  NVIDIA NIM is an easy-to-use inference microservice. You can use popular open source libraries to interact with the model.

  Get your NGC API key from https://ngc.nvidia.com/setup/api-key and set it as the value for the NGC API key parameter

examples:
- title: 'Make an API call to the server'
  description: Once you see the NIM running, wait until the weights are downloaded. Once it is ready, you can interact with the model using the chat endpoint.
  code: |
    curl -X 'POST' \
    '{{ .AppURL | default "http://localhost:8080" }}/v1/chat/completions' \
    -H 'accept: application/json' \
    -H 'Content-Type: application/json' \
    -d '{
        "model": "{{ .ModelName | default "meta/llama3-8b-instruct" }}",
        "messages": [{"role":"user", "content":"Write a limerick about the wonders of GPU computing."}],
        "max_tokens": 64
    }'
- title: 'Use the model from your Python application'
  description: The NIM exposes OpenAI compatible API so you can use it directly from your Python app 
  code: |
    from openai import OpenAI

    client = OpenAI(
      base_url = "{{ .AppURL | default "http://localhost:8080" }}/v1",
      api_key = "local"
    )

    completion = client.chat.completions.create(
      model="{{ .ModelName | default "meta/llama3-8b-instruct" }}",
      messages=[{"role":"user","content":"Write a limerick about the wonders of GPU computing."}],
      temperature=0.5,
      top_p=1,
      max_tokens=1024,
      stream=True
    )

    for chunk in completion:
      if chunk.choices[0].delta.content is not None:
        print(chunk.choices[0].delta.content, end="")

  
---
name: {{ .SynpseTemplateID }}
scheduling:
  type: Conditional
spec:
  containers:
    - name: nvidia-nim
      image: nvcr.io/nim/meta/{{ .ModelImage | default "llama3-8b-instruct:1.0.0" }}
      auth:
        username: $oauthtoken
        password: {{ .NgcApiKey}}
      gpus: all
      user: root
      ports:
        - {{ .Port | default "8080" }}:8000
      volumes:
        - {{ .ModelDirectory | default "/data/nvidia" }}:/opt/nim/.cache
      env:
        - name: NGC_API_KEY
          value: {{ .NgcApiKey}}
        - name: LOCAL_NIM_CACHE
          value: /opt/nim/
      restartPolicy: {}
proxy:
  tunnels:
    - localPort: {{ .Port | default "8000" }}
