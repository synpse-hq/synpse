templates:
- id: ollama
  organization: Ollama
  name: Ollama
  categories:
  - AI
  - Text
  # imageUrl: 'https://avatars.githubusercontent.com/u/151674099?s=200&v=4'
  imageUrl: 'https://storage.googleapis.com/downloads.synpse.net/gallery-assets/ollama.png'
  description: 'Run Llama 2, Code Llama, and other models on CPU or GPU machines.'
  specUrl: https://raw.githubusercontent.com/synpse-hq/synpse/gallery/gallery/templates/ollama.yaml
  gpu: optional
  parameters:
  - name: Port
    description: "Port to expose Ollama API on"
    type: int
    default: "11434"
  - name: ModelDirectory
    description: "Directory to store model files"
    type: text
    default: "/data/ollama"

- id: open-webui
  organization: open-webui
  name: Open WebUI 
  categories:
  - AI
  - Text
  - Chat
  # imageUrl: 'https://avatars.githubusercontent.com/u/151674099?s=200&v=4'
  imageUrl: 'https://storage.googleapis.com/downloads.synpse.net/gallery-assets/open-webui.png'
  description: 'Open WebUI is an extensible, feature-rich, and user-friendly self-hosted WebUI designed to operate entirely offline.'
  specUrl: https://raw.githubusercontent.com/synpse-hq/synpse/gallery/gallery/templates/open-webui.yaml
  gpu: optional
  parameters:
  - name: Port
    description: "Port to expose web UI on"
    type: int
    default: "8844"
  - name: ModelDirectory
    description: "Directory to store model files and configuration in"
    type: text
    default: "/data/open-webui"
    
- id: vllm-mistral-7b
  organization: Mistral AI
  name: Mistral 7B (vLLM)
  categories:
  - AI
  - Text
  - vllm
  imageUrl: 'https://storage.googleapis.com/downloads.synpse.net/gallery-assets/mistral-7b-cover.png'
  description: 'Run Mistral 7B model on a GPU machine. Exposes OpenAI compatible API.'
  specUrl: https://raw.githubusercontent.com/synpse-hq/synpse/gallery/gallery/templates/vllm.yaml
  gpu: required
  parameters:
  - name: Port
    description: "Port to expose API on"
    type: int
    default: "8000"
  - name: ModelDirectory
    description: "Directory to store model files"
    type: text
    default: "/data/vllm"
  - name: Model
    description: "Model name (supported models: https://docs.vllm.ai/en/latest/models/supported_models.html)"
    type: text
    readonly: true
    default: "mistralai/Mistral-7B-v0.1"
  - name: HuggingFaceToken
    description: "Hugging Face API token, get yours here https://huggingface.co/docs/hub/en/security-tokens"
    type: text
    default: ""
