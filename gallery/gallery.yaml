- id: llocal-search
  organization: nilsherzig
  name: LLocalSearch
  categories:
  - AI
  - Text
  - Chat  
  imageUrl: 'https://storage.googleapis.com/downloads.synpse.net/gallery-assets/llocalsearch.png'
  description: 'LLocalSearch is a completely locally running search aggregator using LLM Agents. Ask a question and the system will use a chain of LLMs to find the answer. No OpenAI or Google API keys are needed.'
