  gpu: required
  parameters:
  - name: Port
    description: "Port to expose API on"
    type: int
    default: "5000"
  - name: CogImage
    description: "Model - https://replicate.com/philz1337x/clarity-upscaler?input=docker"
    type: text
    default: "r8.im/philz1337x/clarity-upscaler@sha256:abd484acb51ad450b06f42f76940fa5c1b37511dbf70ac8594fdacd5c3302307"
    readonly: true
  - name: Usage
    readonly: true
    default: 'This model runs on Nvidia A100 (80GB) GPU hardware. Predictions typically complete within 39 seconds. The predict time for this model varies significantly based on the inputs.'
  - name: InputExample
    readonly: true
    default:
      |
      "input": {
        "seed": 1337,
        "image": "https://replicate.delivery/pbxt/KZVIDUcU15XCjloQMdqitfzi6pau7rO70IuGgdRAyHgku70q/13_before.png",
        "prompt": "masterpiece, best quality, highres, <lora:more_details:0.5> <lora:SDXLrender_v2.0:1>",
        "dynamic": 6,
        "sd_model": "juggernaut_reborn.safetensors [338b85bc4f]",
        "scheduler": "DPM++ 3M SDE Karras",
        "creativity": 0.35,
        "lora_links": "",
        "downscaling": false,
        "resemblance": 0.6,
        "scale_factor": 2,
        "tiling_width": 112,
        "tiling_height": 144,
        "negative_prompt": "(worst quality, low quality, normal quality:2) JuggernautNegative-neg",
        "num_inference_steps": 18,
        "downscaling_resolution": 768
      }

